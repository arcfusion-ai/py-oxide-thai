name: Rust extraction checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.95.0'
          components: clippy,rustfmt
          rustflags: ''
      - run: cargo fmt --check
      # The same lint is present in unchanged upstream v0.3.78.
      - run: cargo clippy -- -D warnings -A clippy::nonminimal_bool
      - run: cargo test
      - run: cargo test --features rendering --test test_thai_mark_attachment
