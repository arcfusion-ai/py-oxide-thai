name: Thai extraction and Python wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.95.0'
          rustflags: ''
      - run: cargo fmt --check
      # Upstream v0.3.78 also triggers this lint with Rust 1.95.
      - run: cargo clippy -- -D warnings -A clippy::nonminimal_bool
      - run: cargo test
      - run: cargo test --features rendering --test test_thai_mark_attachment

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ''
      - run: python -m pip install maturin pytest fonttools
      - run: maturin build --release --out dist
      - shell: bash
        run: python -m pip install dist/*.whl
      - run: python -m pytest tests/test_thai_package.py -q
      - if: runner.os == 'Linux'
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: py-oxide-thai-${{ matrix.os }}
          path: dist/*
